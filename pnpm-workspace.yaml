# pnpm 11 把「依赖构建脚本」白名单放在这里（由 `pnpm install` 自动生成占位内容后整理）。
# koffi 是 DSH 侧的原生依赖，其构建脚本对本插件的类型检查 / 测试 / 构建都不是必需的；
# 显式声明为 false，避免 install 因 ERR_PNPM_IGNORED_BUILDS 以非 0 退出。
allowBuilds:
  koffi: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-loop@0.2.2-rc.4'
  - '@deepseek-ai/dsh-agent@0.2.2-rc.4'
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.4'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-store@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-ui-session@0.2.2-rc.4'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.4'
  - '@deepseek-ai/dsh-commands@0.2.2-rc.4'
  - '@deepseek-ai/dsh-compaction-image-offload@0.2.2-rc.4'
  - '@deepseek-ai/dsh-compaction@0.2.2-rc.4'
  - '@deepseek-ai/dsh-error@0.2.2-rc.4'
  - '@deepseek-ai/dsh-fs-local@0.2.2-rc.4'
  - '@deepseek-ai/dsh-fs-patch@0.2.2-rc.4'
  - '@deepseek-ai/dsh-fs@0.2.2-rc.4'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.4'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.2-rc.4'
  - '@deepseek-ai/dsh-sandbox@0.2.2-rc.4'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format-catalog@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format-v0-to-v1@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format-v1-to-v2@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format-v2-to-v3@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format-v3-to-v4@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-format@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-persistence-jsonl@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-persistence@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-query@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-title@0.2.2-rc.4'
  - '@deepseek-ai/dsh-session@0.2.2-rc.4'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.4'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.4'
  - '@deepseek-ai/dsh-tool-fs@0.2.2-rc.4'
  - '@deepseek-ai/dsh-tool-todo@0.2.2-rc.4'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.4'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.4'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-code-language@0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-time@0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.4'
  - '@deepseek-ai/dsh-working-directory@0.2.2-rc.4'
  - '@deepseek-ai/dsh-tool-executor-native@0.2.2-rc.4'

# 无 TTY 的自动化 shell（agent / CI 包装脚本）里，pnpm 11 执行 `pnpm run <script>`
# 前会调用 `pnpm install` 做依赖状态检查，并按「无 TTY 不能清除 node_modules」中止。
# 关掉该检查，让 `pnpm typecheck` / `pnpm test` / `pnpm run build` 可直接跑。
verifyDepsBeforeRun: false
